version: '3.8'
services:
  # 1. MongoDB Database
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
      
  # 2. Node.js Backend
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/todo-crm 
      - JWT_SECRET=supersecretkey123
      - PORT=5000
    depends_on:
      - mongo

  # 3. React/Vite Frontend
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server